<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Soporte Admin — Geckotech</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#0a0f1a;color:#cce0f5;min-height:100vh;display:flex;flex-direction:column}
/* ── Login ── */
#login-screen{display:flex;align-items:center;justify-content:center;flex:1;min-height:100vh}
#login-card{background:#131d2e;border:1px solid #1e2e48;border-radius:12px;padding:40px 44px;width:380px;box-shadow:0 0 60px rgba(61,142,240,.06)}
#login-card .badge{display:block;font-size:9px;letter-spacing:4px;color:#3d8ef0;text-transform:uppercase;margin-bottom:8px}
#login-card h1{font-size:22px;font-weight:700;color:#f1f5f9;margin-bottom:4px}
#login-card .sub{font-size:12px;color:#5a7898;margin-bottom:28px;letter-spacing:.3px}
.l-label{display:block;font-size:9px;letter-spacing:2px;color:#5a7898;text-transform:uppercase;margin-bottom:6px}
.l-input{width:100%;background:#0e1520;border:1px solid #243858;border-radius:5px;color:#cce0f5;padding:10px 12px;font-size:13px;outline:none;font-family:inherit;margin-bottom:16px}
.l-input:focus{border-color:#3d8ef0}
#login-btn{width:100%;border:none;border-radius:5px;padding:11px;font-size:13px;font-weight:700;color:#fff;background:#3d8ef0;cursor:pointer;font-family:inherit;letter-spacing:.5px}
#login-btn:hover{background:#2563c0}
#login-error{color:#fca5a5;font-size:11px;margin-top:10px;text-align:center;min-height:16px}
/* ── App ── */
#app{display:none;flex-direction:column;height:100vh}
#header{background:#1a2540;border-bottom:1px solid #243858;padding:0 20px;height:52px;display:flex;align-items:center;gap:12px;flex-shrink:0}
#header .logo{font-size:16px;font-weight:700;color:#3d8ef0;letter-spacing:-.3px}
#header .sub{font-size:10px;color:#5a7898;margin-right:auto}
.h-btn{border:1px solid #243858;border-radius:4px;padding:4px 12px;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#5a7898;background:transparent;cursor:pointer;font-family:inherit}
.h-btn:hover{color:#cce0f5;border-color:#3d8ef0}
.h-btn.active{color:#3d8ef0;border-color:rgba(61,142,240,.4);background:rgba(61,142,240,.08)}
#agente-label{font-size:11px;color:#5a7898}
#logout-btn{border:1px solid rgba(252,165,165,.3);border-radius:4px;padding:4px 12px;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#fca5a5;background:transparent;cursor:pointer;font-family:inherit}
#logout-btn:hover{background:rgba(252,165,165,.08)}
/* ── Layout ── */
#content{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;min-height:0}
/* ── Filtros ── */
#filtros{background:#131d2e;border:1px solid #1e2e48;border-radius:8px;padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;flex-shrink:0}
.f-select,.f-input{background:#0e1520;border:1px solid #243858;border-radius:5px;color:#cce0f5;padding:6px 10px;font-size:12px;font-family:inherit;outline:none}
.f-select:focus,.f-input:focus{border-color:#3d8ef0}
.f-btn{border:none;border-radius:4px;padding:6px 14px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit}
.f-btn-primary{background:#3d8ef0;color:#060d14}
.f-btn-secondary{background:#1a2540;color:#5a7898;border:1px solid #243858}
.f-btn-secondary:hover{color:#cce0f5}
/* ── KPIs ── */
#kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;flex-shrink:0}
.kpi{background:#131d2e;border:1px solid #1e2e48;border-radius:8px;padding:12px 16px}
.kpi-label{font-size:9px;letter-spacing:2px;color:#5a7898;text-transform:uppercase;margin-bottom:6px}
.kpi-val{font-size:26px;font-weight:700}
/* ── Tabla tickets ── */
#tickets-wrap{background:#131d2e;border:1px solid #1e2e48;border-radius:8px;flex:1;overflow:auto;min-height:200px}
table{width:100%;border-collapse:collapse;min-width:700px}
thead tr{background:#0a0f1a;position:sticky;top:0}
th{padding:9px 12px;font-size:9px;letter-spacing:2px;color:#3a5272;text-transform:uppercase;text-align:left;border-bottom:1px solid #1e2e48;white-space:nowrap}
td{padding:9px 12px;font-size:12px;border-bottom:1px solid #0e1828;vertical-align:middle}
tbody tr{cursor:pointer;transition:background .1s}
tbody tr:hover{background:rgba(61,142,240,.04)}
.badge{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.5px;padding:2px 8px;border-radius:3px;text-transform:uppercase}
.badge-abierto{color:#fde68a;background:rgba(253,230,138,.1);border:1px solid rgba(253,230,138,.3)}
.badge-en_revision{color:#93c5fd;background:rgba(147,197,253,.1);border:1px solid rgba(147,197,253,.3)}
.badge-resuelto{color:#86efac;background:rgba(134,239,172,.1);border:1px solid rgba(134,239,172,.3)}
.badge-soporte{color:#c4b5fd;background:rgba(196,181,253,.1);border:1px solid rgba(196,181,253,.3)}
/* ── Modal detalle ── */
#modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:500;align-items:center;justify-content:center}
#modal-overlay.open{display:flex}
#modal{background:#131d2e;border:1px solid #1e2e48;border-radius:10px;width:900px;max-width:95vw;max-height:90vh;display:flex;flex-direction:column;overflow:hidden}
#modal-header{padding:16px 20px;border-bottom:1px solid #1e2e48;display:flex;align-items:center;gap:10px;flex-shrink:0;flex-wrap:wrap}
#modal-title{font-size:14px;font-weight:700;color:#cce0f5;flex:1}
#modal-close{background:#1a2540;border:1px solid #243858;border-radius:4px;width:28px;height:28px;cursor:pointer;color:#5a7898;font-size:16px;font-family:inherit;display:flex;align-items:center;justify-content:center}
#modal-body{display:grid;grid-template-columns:1fr 300px;flex:1;overflow:hidden}
#modal-hilo{display:flex;flex-direction:column;border-right:1px solid #1e2e48;overflow:hidden}
#modal-desc{padding:14px 16px;border-bottom:1px solid #1e2e48;flex-shrink:0}
#modal-resp-list{flex:1;overflow-y:auto;padding:12px}
.resp-item{border-radius:6px;padding:10px 14px;margin-bottom:8px}
.resp-cliente{background:#0e1520;border-left:3px solid #5a7898}
.resp-soporte{background:#0e1520;border-left:3px solid #3d8ef0}
.resp-meta{font-size:9px;color:#3a5272;margin-bottom:4px;display:flex;justify-content:space-between}
.resp-text{font-size:12px;color:#cce0f5;white-space:pre-wrap;line-height:1.5}
#modal-reply{padding:12px 16px;border-top:1px solid #1e2e48;flex-shrink:0}
#reply-input{width:100%;background:#0e1520;border:1px solid #243858;border-radius:5px;color:#cce0f5;padding:8px 10px;font-size:12px;font-family:inherit;resize:none;outline:none}
#reply-input:focus{border-color:#3d8ef0}
#modal-info{padding:16px;overflow-y:auto;font-size:11px;display:flex;flex-direction:column;gap:8px}
.info-row{display:flex;flex-direction:column;gap:2px}
.info-label{color:#3a5272;font-size:9px;letter-spacing:1px;text-transform:uppercase}
.info-val{color:#cce0f5}
.hist-item{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid #0e1828;font-size:10px}
.hist-soporte{color:#c4b5fd}
.hist-cliente{color:#8aaccc}
.file-chip{display:inline-flex;align-items:center;gap:6px;background:#1a2540;border:1px solid #243858;border-radius:4px;padding:3px 10px;font-size:11px;color:#8aaccc;text-decoration:none;margin:3px 3px 0 0}
.file-chip:hover{border-color:#3d8ef0;color:#cce0f5}
/* ── Agentes ── */
#agentes-panel{display:flex;flex-direction:column;gap:10px}
.agente-card{background:#131d2e;border:1px solid #1e2e48;border-radius:8px;padding:14px 16px;display:flex;align-items:center;gap:12px}
.agente-info{flex:1}
.agente-nombre{font-size:13px;font-weight:600;color:#cce0f5}
.agente-email{font-size:11px;color:#5a7898}
.tag-activo{color:#86efac;font-size:10px}
.tag-inactivo{color:#fca5a5;font-size:10px}
/* ── Nuevo ticket form ── */
#nuevo-form{background:#131d2e;border:1px solid #1e2e48;border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:14px;max-width:700px}
.n-label{font-size:9px;letter-spacing:2px;color:#5a7898;text-transform:uppercase;margin-bottom:6px;display:block}
.n-input,.n-textarea{width:100%;background:#0e1520;border:1px solid #243858;border-radius:5px;color:#cce0f5;padding:8px 12px;font-size:13px;font-family:inherit;outline:none}
.n-input:focus,.n-textarea:focus{border-color:#3d8ef0}
.n-textarea{resize:vertical;min-height:100px}
</style>
</head>

    <button class="h-btn active" id="btn-tickets" onclick="showView('tickets')"><i class="ti ti-ticket"></i> Tickets</button>
    <button class="h-btn" id="btn-nuevo" onclick="showView('nuevo')"><i class="ti ti-plus"></i> Nuevo</button>

  <div id="content">
    <!-- Tickets view -->
    <div id="view-tickets">
      <div id="kpis">
        <div class="kpi"><div class="kpi-label">Total</div><div class="kpi-val" id="kpi-total" style="color:#cce0f5">0</div></div>
        <div class="kpi"><div class="kpi-label">Abiertos</div><div class="kpi-val" id="kpi-abiertos" style="color:#fde68a">0</div></div>
        <div class="kpi"><div class="kpi-label">En revisión</div><div class="kpi-val" id="kpi-revision" style="color:#93c5fd">0</div></div>
        <div class="kpi"><div class="kpi-label">Resueltos</div><div class="kpi-val" id="kpi-resueltos" style="color:#86efac">0</div></div>
      </div>
      <div id="filtros">
        <span style="font-size:9px;letter-spacing:2px;color:#5a7898;text-transform:uppercase">Filtros</span>
        <select class="f-select" id="f-estado" onchange="loadTickets()">
          <option value="todos">Todos los estados</option>
          <option value="abierto">Abierto</option>
          <option value="en_revision">En revisión</option>
          <option value="resuelto">Resuelto</option>
        </select>
        <input class="f-input" id="f-cliente" type="text" placeholder="Buscar por cliente..." onkeydown="if(event.key==='Enter')loadTickets()" style="width:200px"/>
        <button class="f-btn f-btn-primary" onclick="loadTickets()">Buscar</button>
        <button class="f-btn f-btn-secondary" onclick="document.getElementById('f-estado').value='todos';document.getElementById('f-cliente').value='';loadTickets()">Limpiar</button>
        <span style="margin-left:auto;font-size:10px;color:#3a5272" id="tickets-count"></span>
        <button class="f-btn f-btn-secondary" onclick="loadTickets()"><i class="ti ti-refresh"></i> Actualizar</button>
      </div>
      <div id="tickets-wrap">
        <table>
          <thead><tr>
            <th>#</th><th>Título</th><th>Cliente</th><th>Estado</th><th>Agente</th><th>Respuestas</th><th>Última actividad</th>
          </tr></thead>
          <tbody id="tickets-tbody"><tr><td colspan="7" style="padding:40px;text-align:center;color:#3a5272">Cargando...</td></tr></tbody>
        </table>
      </div>
    </div>

    <!-- Nuevo ticket view -->
    <div id="view-nuevo" style="display:none">
      <div id="nuevo-form">
        <div style="font-size:9px;letter-spacing:2px;color:#5a7898;text-transform:uppercase">Nuevo Ticket de Soporte</div>
        <div><label class="n-label">Título</label><input class="n-input" id="n-titulo" type="text" placeholder="Describe el problema..."/></div>
        <div><label class="n-label">Descripción</label><textarea class="n-textarea" id="n-desc" placeholder="Detalla el problema..."></textarea></div>
        <div><label class="n-label">Archivos adjuntos (máx 3)</label>
          <input type="file" id="n-files" multiple accept=".png,.jpg,.jpeg,.pdf,.docx" style="color:#8aaccc;font-size:12px"/>
        </div>
        <div id="n-error" style="display:none;color:#fca5a5;font-size:11px"></div>
        <div><button class="f-btn f-btn-primary" onclick="submitNuevoTicket()" style="padding:9px 24px;font-size:12px">Crear ticket</button></div>
      </div>
    </div>

    <!-- Agentes view -->
    <div id="view-agentes" style="display:none">
      <div style="display:flex;flex-direction:column;gap:12px">
        <div style="background:#131d2e;border:1px solid #1e2e48;border-radius:8px;padding:14px 16px;display:flex;align-items:center;gap:10px">
          <span style="font-size:9px;letter-spacing:2px;color:#5a7898;text-transform:uppercase;margin-right:auto">Agentes de Soporte</span>
          <button class="f-btn f-btn-primary" onclick="showNuevoAgente()">+ Nuevo agente</button>
        </div>
        <div id="agentes-panel"></div>
        <!-- Form nuevo agente -->
        <div id="nuevo-agente-form" style="display:none;background:#131d2e;border:1px solid #1e2e48;border-radius:8px;padding:20px;max-width:500px">
          <div style="font-size:9px;letter-spacing:2px;color:#5a7898;text-transform:uppercase;margin-bottom:14px">Nuevo Agente</div>
          <div style="display:flex;flex-direction:column;gap:10px">
            <div><label class="n-label">Nombre</label><input class="n-input" id="ag-nombre" type="text" placeholder="Nombre completo"/></div>
            <div><label class="n-label">Email</label><input class="n-input" id="ag-email" type="email" placeholder="agente@geckotech.com.mx"/></div>
            <div><label class="n-label">Contraseña</label><input class="n-input" id="ag-pass" type="password" placeholder="Mínimo 8 caracteres"/></div>
            <div style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="ag-admin" style="accent-color:#c4b5fd;width:14px;height:14px"/><label for="ag-admin" style="font-size:11px;color:#8aaccc;cursor:pointer">Rol Administrador — puede gestionar agentes</label></div>
            <div id="ag-error" style="display:none;color:#fca5a5;font-size:11px"></div>
            <div style="display:flex;gap:8px">
              <button class="f-btn f-btn-primary" onclick="crearAgente()">Crear agente</button>
              <button class="f-btn f-btn-secondary" onclick="document.getElementById('nuevo-agente-form').style.display='none'">Cancelar</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal detalle ticket -->
<div id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div id="modal">
    <div id="modal-header">
      <span id="modal-title">Ticket</span>
      <select id="modal-estado" onchange="cambiarEstado()" style="background:#0e1520;border:1px solid #243858;border-radius:4px;color:#cce0f5;padding:4px 8px;font-size:11px;font-family:inherit;outline:none">
        <option value="abierto">Abierto</option>
        <option value="en_revision">En revisión</option>
        <option value="resuelto">Resuelto</option>
      </select>
      <button id="modal-close" onclick="closeModal()">×</button>
    </div>
    <div id="modal-body">
      <div id="modal-hilo">
        <div id="modal-desc"></div>
        <div id="modal-resp-list"></div>
        <div id="modal-reply">
          <textarea id="reply-input" rows="3" placeholder="Escribe una respuesta como soporte Geckotech..."></textarea>
          <div style="display:flex;gap:8px;margin-top:8px">
            <button class="f-btn f-btn-primary" onclick="enviarRespuesta()" style="font-size:11px;padding:6px 16px">Responder</button>
          </div>
        </div>
      </div>
      <div id="modal-info"></div>
    </div>
  </div>
</div>

<script>
var SA_SESSION_KEY = 'sa_session';
var _saAgente = null;
var _ticketActual = null;

// ── Helpers ───────────────────────────────────────────────────────────────────
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtDate(ts) {
  if (!ts) return '-';
  var s = String(ts).trim().replace(' ','T');
  if (!s.endsWith('Z') && !s.includes('+')) s += 'Z';
  var d = new Date(s); if (isNaN(d.getTime())) return ts;
  return d.toLocaleString('es-MX', { timeZone:'America/Mexico_City', year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hour12:false });
}
function saveSession(agente) { localStorage.setItem(SA_SESSION_KEY, JSON.stringify(agente)); }
function loadSession() { try { return JSON.parse(localStorage.getItem(SA_SESSION_KEY)); } catch(e) { return null; } }
function clearSession() { localStorage.removeItem(SA_SESSION_KEY); }

// ── Auth ──────────────────────────────────────────────────────────────────────
async function saLogin() {
  var email = document.getElementById('sa-email').value.trim();
  var pass  = document.getElementById('sa-pass').value;
  var errEl = document.getElementById('login-error');
  var btn   = document.getElementById('login-btn');
  if (!email || !pass) { errEl.textContent = 'Ingresa email y contraseña'; return; }
  errEl.textContent = ''; btn.disabled = true; btn.textContent = 'Verificando...';
  try {
    var res = await fetch('/api/soporte/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({email,password:pass}) });
    var data = await res.json();
    if (!res.ok) { errEl.textContent = data.error || 'Error de acceso'; return; }
    _saAgente = data.agente;
    saveSession(_saAgente);
    showApp();
  } catch(e) { errEl.textContent = 'Error de conexión'; }
  btn.disabled = false; btn.textContent = 'Entrar →';
}

function saLogout() {
  clearSession(); _saAgente = null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
}

function showApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('agente-label').textContent = _saAgente.nombre + ' (' + _saAgente.email + ')';
  // Mostrar gestión de agentes solo para admin
  var btnAg = document.getElementById('btn-agentes');
  if (btnAg) btnAg.style.display = _saAgente.es_admin ? 'inline-block' : 'none';
  showView('tickets');
}

// ── Views ─────────────────────────────────────────────────────────────────────
function showView(v) {
  ['tickets','nuevo','agentes'].forEach(function(id) {
    document.getElementById('view-' + id).style.display = id === v ? (id==='tickets'?'flex':'block') : 'none';
    var btn = document.getElementById('btn-' + id);
    if (btn) btn.classList.toggle('active', id === v);
  });
  if (v === 'tickets') { document.getElementById('view-tickets').style.flexDirection='column'; document.getElementById('view-tickets').style.gap='10px'; loadTickets(); }
  if (v === 'agentes') loadAgentes();
}

// ── Tickets ───────────────────────────────────────────────────────────────────
var _tickets = [];
async function loadTickets() {
  var tbody = document.getElementById('tickets-tbody');
  tbody.innerHTML = '<tr><td colspan="7" style="padding:30px;text-align:center;color:#3a5272">Cargando...</td></tr>';
  var estado = document.getElementById('f-estado').value;
  var cliente = document.getElementById('f-cliente').value.trim();
  var url = '/api/soporte/tickets?estado=' + encodeURIComponent(estado) + '&cliente=' + encodeURIComponent(cliente);
  try {
    var res = await fetch(url);
    _tickets = await res.json();
    updateKPIs();
    renderTickets();
  } catch(e) {
    tbody.innerHTML = '<tr><td colspan="7" style="padding:30px;text-align:center;color:#fca5a5">Error al cargar</td></tr>';
  }
}

function updateKPIs() {
  var all = _tickets;
  document.getElementById('kpi-total').textContent = all.length;
  document.getElementById('kpi-abiertos').textContent = all.filter(function(t){return t.estado==='abierto';}).length;
  document.getElementById('kpi-revision').textContent = all.filter(function(t){return t.estado==='en_revision';}).length;
  document.getElementById('kpi-resueltos').textContent = all.filter(function(t){return t.estado==='resuelto';}).length;
  document.getElementById('tickets-count').textContent = all.length + ' registros';
}

function renderTickets() {
  var tbody = document.getElementById('tickets-tbody');
  if (!_tickets.length) { tbody.innerHTML = '<tr><td colspan="7" style="padding:40px;text-align:center;color:#3a5272">Sin tickets</td></tr>'; return; }
  tbody.innerHTML = _tickets.map(function(t) {
    var badge = '<span class="badge badge-' + t.estado + '">' + (t.estado==='abierto'?'Abierto':t.estado==='en_revision'?'En revisión':'Resuelto') + '</span>';
    var agente = t.agente_email ? '<span class="badge badge-soporte">' + esc(t.agente_email.split('@')[0]) + '</span>' : '<span style="color:#3a5272">—</span>';
    return '<tr onclick="openTicket(' + t.id + ')">' +
      '<td style="color:#3a5272">#' + t.id + '</td>' +
      '<td style="color:#cce0f5;font-weight:500;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(t.titulo) + '</td>' +
      '<td style="color:#8aaccc;font-size:11px">' + esc((t.user_email||'').split('@')[0]) + '</td>' +
      '<td>' + badge + '</td>' +
      '<td>' + agente + '</td>' +
      '<td style="color:#5a7898;text-align:center">' + (t.respuestas_count||0) + '</td>' +
      '<td style="color:#5a7898;font-size:11px">' + fmtDate(t.updated_at) + '</td>' +
    '</tr>';
  }).join('');
}

// ── Modal detalle ─────────────────────────────────────────────────────────────
async function openTicket(id) {
  try {
    var res = await fetch('/api/soporte/tickets/' + id);
    _ticketActual = await res.json();
    renderModal();
    document.getElementById('modal-overlay').classList.add('open');
  } catch(e) { alert('Error al cargar ticket'); }
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  _ticketActual = null;
  loadTickets();
}

function renderModal() {
  var t = _ticketActual;
  document.getElementById('modal-title').textContent = '#' + t.id + ' — ' + t.titulo;
  document.getElementById('modal-estado').value = t.estado;

  // Descripción
  var archivosHtml = (t.archivos||[]).map(function(a) {
    var icon = a.mimetype==='application/pdf'?'📄':a.mimetype.startsWith('image')?'🖼️':'📎';
    return '<a href="/ticket_uploads/' + esc(a.filename) + '" target="_blank" class="file-chip">' + icon + ' ' + esc(a.originalname) + '</a>';
  }).join('');
  document.getElementById('modal-desc').innerHTML =
    '<div style="padding:14px 16px">' +
      '<div style="font-size:9px;color:#3a5272;margin-bottom:6px">Cliente: <strong style="color:#8aaccc">' + esc(t.user_email||'') + '</strong> · ' + fmtDate(t.created_at) + '</div>' +
      '<div style="font-size:13px;color:#cce0f5;white-space:pre-wrap;line-height:1.6">' + esc(t.descripcion) + '</div>' +
      (archivosHtml ? '<div style="margin-top:10px">' + archivosHtml + '</div>' : '') +
    '</div>';

  // Respuestas
  var resps = (t.respuestas||[]).map(function(r) {
    var isSoporte = r.user_email && r.user_email.includes('geckotech');
    return '<div class="resp-item ' + (isSoporte?'resp-soporte':'resp-cliente') + '">' +
      '<div class="resp-meta">' +
        '<span>' + esc(r.user_email||'') + (isSoporte?' <strong style="color:#c4b5fd">[Soporte Geckotech]</strong>':'') + '</span>' +
        '<span>' + fmtDate(r.created_at) + '</span>' +
      '</div>' +
      '<div class="resp-text">' + esc(r.mensaje) + '</div>' +
    '</div>';
  }).join('') || '<div style="padding:20px;text-align:center;color:#3a5272;font-size:11px">Sin respuestas aún</div>';
  document.getElementById('modal-resp-list').innerHTML = resps;
  document.getElementById('reply-input').value = '';

  // Info + historial
  var histHtml = (t.historial||[]).map(function(h) {
    var icons = { creado:'🆕', estado_cambiado:'🔄', respuesta:'💬' };
    var cls = h.es_agente ? 'hist-soporte' : 'hist-cliente';
    return '<div class="hist-item"><span>' + (icons[h.accion]||'•') + '</span>' +
      '<div class="' + cls + '"><div>' + esc((h.user_email||'').split('@')[0]) + (h.es_agente?' [Soporte]':'') + ' · ' + fmtDate(h.created_at) + '</div>' +
      '<div style="color:#5a7898;margin-top:2px">' + esc(h.detalle||'') + '</div></div></div>';
  }).join('');

  document.getElementById('modal-info').innerHTML =
    '<div class="info-row"><span class="info-label">ID</span><span class="info-val">#' + t.id + '</span></div>' +
    '<div class="info-row"><span class="info-label">Cliente</span><span class="info-val">' + esc(t.user_email||'') + '</span></div>' +
    '<div class="info-row"><span class="info-label">Creado por</span><span class="info-val">' + esc(t.created_by||t.user_email||'') + '</span></div>' +
    '<div class="info-row"><span class="info-label">Creado</span><span class="info-val">' + fmtDate(t.created_at) + '</span></div>' +
    (t.closed_by ? '<div class="info-row"><span class="info-label">Cerrado por</span><span class="info-val" style="color:#86efac">' + esc(t.closed_by) + '</span></div>' : '') +
    (t.closed_at ? '<div class="info-row"><span class="info-label">Fecha cierre</span><span class="info-val" style="color:#86efac">' + fmtDate(t.closed_at) + '</span></div>' : '') +
    '<div class="info-row"><span class="info-label">Agente asignado</span><span class="info-val" style="color:#c4b5fd">' + esc(t.agente_email||'Sin asignar') + '</span></div>' +
    '<div style="margin-top:12px;border-top:1px solid #1e2e48;padding-top:12px">' +
      '<div class="info-label" style="margin-bottom:8px">Historial</div>' + histHtml +
    '</div>';
}

async function cambiarEstado() {
  if (!_ticketActual) return;
  var estado = document.getElementById('modal-estado').value;
  try {
    await fetch('/api/soporte/tickets/' + _ticketActual.id, {
      method: 'PUT',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ estado, agente_email: _saAgente.email })
    });
    _ticketActual.estado = estado;
    renderModal();
  } catch(e) { alert('Error: ' + e.message); }
}

async function enviarRespuesta() {
  if (!_ticketActual) return;
  var msg = (document.getElementById('reply-input').value||'').trim();
  if (!msg) { document.getElementById('reply-input').focus(); return; }
  try {
    await fetch('/api/soporte/tickets/' + _ticketActual.id + '/respuestas', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ mensaje: msg, agente_email: _saAgente.email, agente_nombre: _saAgente.nombre })
    });
    var res = await fetch('/api/soporte/tickets/' + _ticketActual.id);
    _ticketActual = await res.json();
    renderModal();
  } catch(e) { alert('Error: ' + e.message); }
}

// ── Nuevo ticket ──────────────────────────────────────────────────────────────
async function submitNuevoTicket() {
  var titulo = (document.getElementById('n-titulo').value||'').trim();
  var desc   = (document.getElementById('n-desc').value||'').trim();
  var errEl  = document.getElementById('n-error');
  if (!titulo) { errEl.textContent='El título es obligatorio'; errEl.style.display='block'; return; }
  if (!desc)   { errEl.textContent='La descripción es obligatoria'; errEl.style.display='block'; return; }
  errEl.style.display='none';
  try {
    var fd = new FormData();
    fd.append('titulo', titulo); fd.append('descripcion', desc);
    fd.append('agente_email', _saAgente.email); fd.append('agente_nombre', _saAgente.nombre);
    var files = document.getElementById('n-files').files;
    for (var i=0;i<Math.min(files.length,3);i++) fd.append('archivos', files[i]);
    var res = await fetch('/api/soporte/tickets', { method:'POST', body: fd });
    var data = await res.json();
    if (!res.ok) { errEl.textContent=data.error||'Error'; errEl.style.display='block'; return; }
    document.getElementById('n-titulo').value='';
    document.getElementById('n-desc').value='';
    document.getElementById('n-files').value='';
    showView('tickets');
    await openTicket(data.id);
  } catch(e) { errEl.textContent='Error: '+e.message; errEl.style.display='block'; }
}

// ── Agentes ───────────────────────────────────────────────────────────────────
var _agentes = [];
async function loadAgentes() {
  var panel = document.getElementById('agentes-panel');
  panel.innerHTML = '<div style="padding:20px;text-align:center;color:#3a5272;font-size:11px">Cargando...</div>';
  try {
    var res = await fetch('/api/soporte/agentes');
    _agentes = await res.json();
    panel.innerHTML = _agentes.map(function(a) {
      return '<div class="agente-card">' +
        '<div style="width:38px;height:38px;border-radius:50%;background:#1a2540;border:1px solid #243858;display:flex;align-items:center;justify-content:center;font-size:16px;color:#3d8ef0;flex-shrink:0"><i class="ti ti-user"></i></div>' +
        '<div class="agente-info">' +
          '<div class="agente-nombre">' + esc(a.nombre) + '</div>' +
          '<div class="agente-email">' + esc(a.email) + '</div>' +
        '</div>' +
        '<span class="' + (a.activo?'tag-activo':'tag-inactivo') + '">' + (a.activo?'● Activo':'● Inactivo') + '</span>' +
        '<button class="f-btn f-btn-secondary" onclick="toggleAgente(' + a.id + ',' + (a.activo?0:1) + ')" style="font-size:10px">' + (a.activo?'Desactivar':'Activar') + '</button>' +
        '<button class="f-btn f-btn-secondary" onclick="confirmarEliminarAgente(' + a.id + ',\'' + esc(a.nombre) + '\')" style="font-size:10px;color:#fca5a5">Eliminar</button>' +
      '</div>';
    }).join('') || '<div style="padding:20px;text-align:center;color:#3a5272;font-size:11px">Sin agentes registrados</div>';
  } catch(e) { panel.innerHTML = '<div style="padding:20px;text-align:center;color:#fca5a5;font-size:11px">Error al cargar</div>'; }
}

function showNuevoAgente() { document.getElementById('nuevo-agente-form').style.display='block'; }

async function crearAgente() {
  var nombre = (document.getElementById('ag-nombre').value||'').trim();
  var email  = (document.getElementById('ag-email').value||'').trim();
  var pass   = (document.getElementById('ag-pass').value||'').trim();
  var errEl  = document.getElementById('ag-error');
  if (!nombre||!email||!pass) { errEl.textContent='Todos los campos son obligatorios'; errEl.style.display='block'; return; }
  try {
    var esAdmin = document.getElementById('ag-admin') && document.getElementById('ag-admin').checked ? 1 : 0;
    var res = await fetch('/api/soporte/agentes', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({nombre,email,password:pass,es_admin:esAdmin}) });
    var data = await res.json();
    if (!res.ok) { errEl.textContent=data.error||'Error'; errEl.style.display='block'; return; }
    document.getElementById('ag-nombre').value=''; document.getElementById('ag-email').value=''; document.getElementById('ag-pass').value='';
    document.getElementById('nuevo-agente-form').style.display='none';
    errEl.style.display='none';
    loadAgentes();
  } catch(e) { errEl.textContent='Error: '+e.message; errEl.style.display='block'; }
}

async function toggleAgente(id, activo, esAdmin) {
  var ag = _agentes.find(function(a){return a.id===id;});
  if (!ag) return;
  try {
    await fetch('/api/soporte/agentes/' + id, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({nombre:ag.nombre, activo, es_admin:esAdmin}) });
    loadAgentes();
  } catch(e) { alert('Error: '+e.message); }
}

async function confirmarEliminarAgente(id, nombre) {
  if (!confirm('¿Eliminar agente "' + nombre + '"? Esta acción no se puede deshacer.')) return;
  try {
    await fetch('/api/soporte/agentes/' + id, { method:'DELETE' });
    loadAgentes();
  } catch(e) { alert('Error: '+e.message); }
}

// ── Init ──────────────────────────────────────────────────────────────────────
(function() {
  var sess = loadSession();
  if (sess && sess.email) { _saAgente = sess; showApp(); }
})();
</script>
</body>
</html>
